# Applied on top of the root docker-compose.yml for system tests:
#   docker compose -f docker-compose.yml -f test/docker-compose-test.yml ...
#
# imds-net gives hasher-api and export-api a link-local route to the
# assumed-identity mock at 169.254.169.254. extra_hosts lets those
# containers reach the test FTP server on the Docker host.

networks:
    imds-net:
        driver: bridge
        ipam:
            config:
                - subnet: 169.254.169.0/24

services:
    hasher-api:
        networks:
            - imds-net

    export-api:
        networks:
            - imds-net
        extra_hosts:
            - "host.docker.internal:host-gateway"

    orthanc-anon:
        extra_hosts:
            - "host.docker.internal:host-gateway"
