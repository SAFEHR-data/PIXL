[project]
name = "core"
version = "0.3.0rc0"
authors = [{ name = "PIXL core functionality" }]
description = ""
readme = "README.md"
requires-python = ">=3.13"
classifiers = ["Programming Language :: Python :: 3"]
dependencies = [
    "aio_pika==9.6.2",
    "azure-identity==1.27.0",
    "azure-keyvault-secrets==4.12.0",
    "fastapi==0.162.0",
    "jsonpickle==4.1.4",
    "loguru==0.7.3",
    "opentelemetry-distro==0.63b1",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.1",
    "opentelemetry-instrumentation-aio-pika==0.63b1",
    "opentelemetry-instrumentation-aiohttp-client==0.63b1",
    "opentelemetry-instrumentation-fastapi==0.63b1",
    "opentelemetry-instrumentation-pika==0.63b1",
    "opentelemetry-instrumentation-requests==0.63b1",
    "opentelemetry-instrumentation-sqlalchemy==0.63b1",
    "pandas==2.3.3",
    "pika==1.4.4",
    "psycopg2-binary==2.9.13",
    "pyarrow==18.1.0",
    "pydantic==2.14.1",
    "python-decouple==3.8",
    "python-slugify==8.0.4",
    "PyYAML==6.0.3",
    "requests==2.34.2",
    "sqlalchemy==2.1.6",
    "token-bucket==0.4.0",
    "xnat>=0.8",
]


[build-system]
requires = ["hatchling>=1.0.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
dev-mode-dirs = [
    "src"
]


[tool.pytest.ini_options]
markers = ["pika"]

[tool.ruff]
extend = "../ruff.toml"

[tool.ruff.lint.extend-per-file-ignores]
"./tests/**" = ["D100"]


[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "except subprocess.CalledProcessError as exception:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
