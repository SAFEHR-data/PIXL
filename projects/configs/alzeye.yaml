project:
    name: "alzeye"
    modalities: ["MR"]

tag_operation_files:
    base:
        - "base.yaml" #Expected base config file for any project
        - "mri.yaml"
        - "keep-acquisition-date-time.yaml"
    manufacturer_overrides: ["mri.yaml", "mri-diffusion.yaml"]

allowed_manufacturers:
  - regex: "^siemens"
    exclude_series_numbers: []
  - regex: "^philips"
    exclude_series_numbers: []

min_instances_per_series: 10

series_filters:
  - "localizer"
  - "localiser"
  - "scout"
  - "positioning"
  - "mip"  # for PET studies these series have PID

destination:
    dicom: "ftps"
    parquet: "ftps"
